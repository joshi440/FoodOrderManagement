
apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-order-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: food-order
  template:
    metadata:
      labels:
        app: food-order
    spec:
      containers:
        - name: food-order-container
          image: food-order-management:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
