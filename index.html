
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Order Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 400px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
            color: #e65c00;
        }

        label {
            display: block;
            margin-top: 12px;
        }

        input, select, button {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            margin-top: 6px;
        }

        button {
            margin-top: 20px;
            background: #e65c00;
            color: white;
            border: none;
            cursor: pointer;
        }

        #message {
            text-align: center;
            color: green;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Food Order Registration</h2>

        <form id="registrationForm">
            <label for="name">Full Name</label>
            <input type="text" id="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" pattern="[0-9]{10}"
                   maxlength="10" required>

            <label for="food">Choose Food</label>
            <select id="food" required>
                <option value="">Select an item</option>
                <option value="Pizza">Pizza</option>
                <option value="Burger">Burger</option>
                <option value="Biryani">Biryani</option>
                <option value="Dosa">Dosa</option>
            </select>

            <button type="submit">Register Order</button>
        </form>

        <p id="message"></p>
    </div>

    <script>
        document.getElementById("registrationForm")
            .addEventListener("submit", function(event) {
                event.preventDefault();

                const name = document.getElementById("name").value;
                const food = document.getElementById("food").value;

                document.getElementById("message").textContent =
                    "Thank you, " + name +
                    "! Your " + food + " order is registered.";
            });
    </script>

</body>
</html>
